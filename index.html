<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TKD Teoriquiz">
<meta name="description" content="Teoriquiz for Røyken Taekwon-Do Klubb – fra 10. gup til 3. dan">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)">
<title>Røyken TKD – Teoriquiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f6f3ec;--card:#fff;--ink:#15151a;--mute:#6d6a63;--line:#e6e0d4;--soft:#efeadf;
 --red:#d6402a;--blue:#2f5da8;--green:#2e7d46;--yellow:#f2c230;
 --ok:#1f8a4c;--okbg:#e6f4ea;--bad:#c8372d;--badbg:#fbe9e7;
 --r:18px;--sh:0 1px 2px rgba(20,20,26,.04),0 8px 24px rgba(20,20,26,.06);
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0e0e0f;--card:#18181b;--ink:#f2f1ee;--mute:#9a978f;--line:#2a2a2e;--soft:#202024;
 --ok:#4cc27a;--okbg:#14261b;--bad:#ef6b5f;--badbg:#2b1715;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.qq,.start span,.rv,.pc,.gn{font-family:Outfit,Inter,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px;position:relative;overflow:hidden}
/* header */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 6px;position:relative;z-index:1}
.logo{width:52px;height:52px;flex:none}
.tt{flex:1;min-width:0}
.club{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
h1{font-size:30px;margin:0;line-height:1.05;font-weight:800;letter-spacing:-.01em}
.hangul{position:absolute;right:-8px;top:54px;font-size:92px;font-weight:700;color:var(--ink);opacity:.045;pointer-events:none;letter-spacing:-.05em;font-family:serif}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px}
section{margin-top:18px;position:relative;z-index:1}
.hint{margin:-6px 0 10px;font-size:13px;color:var(--mute)}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
/* grades */
.grades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grade{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center;gap:6px 10px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;transition:transform .12s,border-color .12s,box-shadow .12s}
.grade:active{transform:scale(.98)}
.grade .belt{grid-row:1;grid-column:1}
.gn{grid-row:1;grid-column:2;font-weight:600;font-size:15px;white-space:nowrap}
.gpt{grid-row:1;grid-column:3;font-size:12px;white-space:nowrap;color:var(--mute);font-variant-numeric:tabular-nums}
.gp{grid-row:2;grid-column:1/4;height:5px;border-radius:9px;background:var(--soft);overflow:hidden}
.gp i{display:block;height:100%;background:var(--green);border-radius:9px}
.grade.sel{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.grades.dans{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px}
.grades.dans .grade{padding:10px;gap:4px 6px;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto}
.grades.dans .belt{width:40px}
.grades.dans .gpt{grid-row:1;grid-column:2;justify-self:end}
.grades.dans .gn{grid-row:2;grid-column:1/3;font-size:15px}
.grades.dans .gp{grid-row:3;grid-column:1/3}
.grade{min-width:0}
.subs{display:flex;align-items:center;gap:4px;padding:4px;border-radius:14px;background:var(--soft);margin-top:8px}
.subs .lbl{font-size:13px;color:var(--mute);padding:0 8px}
.subs button{flex:1;border:0;background:transparent;padding:9px 2px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mute);white-space:nowrap}
.subs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.belt{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
/* segmented */
.opts2{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;align-items:center;gap:4px;padding:4px;border-radius:14px;background:var(--soft)}
.seg button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .lbl{font-size:13px;color:var(--mute);padding:0 8px;white-space:nowrap}
.tnote{width:100%;display:flex;gap:10px;align-items:center;text-align:left;margin-top:16px;padding:11px 14px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--ink) 25%,var(--line));background:transparent;color:var(--mute);font-size:13.5px;line-height:1.35}
.tnote svg{width:18px;height:18px;flex:none;color:var(--ink)}
.th3{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.th3 h3{margin:0!important}
.selall{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
/* start */
.start{width:100%;margin-top:16px;border:0;border-radius:14px;padding:13px 16px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;z-index:1}
.start span{font-size:17px;font-weight:700}
.start small{opacity:.7;font-size:12.5px}
.start:disabled{opacity:.45}
.start:not(:disabled):active{transform:scale(.99)}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:16px}
/* play */
.playbar{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.pbar{flex:1;height:8px;border-radius:9px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .35s ease}
.pc{font-weight:600;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px;box-shadow:var(--sh)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{--tc:#666;display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);padding:4px 8px;border-radius:7px}
.lvl{font-size:12px;color:var(--mute);font-weight:500}
.pat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink);background:var(--soft);padding:3px 8px 3px 6px;border-radius:7px;margin-left:auto}
.qq{font-size:23px;line-height:1.25;margin:14px 0 16px;font-weight:700;letter-spacing:-.005em}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);transition:transform .1s,border-color .15s,background .15s,opacity .2s;min-height:54px}
.choice:not(:disabled):hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
.choice:not(:disabled):active{transform:scale(.985)}
.key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mute);margin-top:-1px}
.ct{white-space:pre-line;font-size:15.5px;line-height:1.4;display:flex;gap:10px;align-items:center}
.ct .dg{flex:none}
.choice.right{border-color:var(--ok);background:var(--okbg)}
.choice.right .key{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.choice.wrong .key{background:var(--bad);color:#fff}
.choice.dim{opacity:.5}
.pop{animation:pop .35s ease}
.shake{animation:shake .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.fb{margin-top:12px;border-radius:16px;padding:14px 16px;animation:up .25s ease}
.fb.ok{background:var(--okbg);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.bad{background:var(--badbg);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.fbh{font-family:Outfit,sans-serif;font-weight:700;font-size:18px}
.fb.ok .fbh{color:var(--ok)}.fb.bad .fbh{color:var(--bad)}
.fbh span{font-family:Inter;font-weight:500;font-size:13px;color:var(--mute)}
.fa{margin-top:8px;white-space:pre-line;font-size:15px}
.fa span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.fn{margin-top:8px;font-size:12.5px;color:var(--mute)}
.link{border:0;background:none;padding:8px 0 0;font-weight:600;color:var(--blue);text-decoration:underline}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.primary,.ghost,.danger{width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;border:1.5px solid var(--ink)}
.primary{background:var(--ink);color:var(--bg)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.next{margin-top:12px;display:flex;justify-content:center;gap:8px}
.inp{width:100%;font-size:19px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.inp:focus{border-color:var(--ink)}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
/* summary */
.sum{text-align:center;padding-top:20px}
.ring{position:relative;width:150px;height:150px;margin:0 auto 10px}
.ring svg{transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--soft);stroke-width:11}
.rfg{fill:none;stroke:var(--green);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.rv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.rv>span{display:inline-flex;align-items:baseline;font-size:42px;font-weight:800;line-height:1}
.rv small{font-size:18px;margin-left:2px}
.sum h2{font-size:24px;margin:6px 0 0}
.sub{color:var(--mute);margin:4px 0 14px}
.gstat{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px}
.weak{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:16px}
.weak h3{margin:0 0 8px;font-size:15px}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:0}
.wrow b{font-size:14px}
.sumbtns{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 2.8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{top:105%;transform:translateX(40px) rotate(720deg)}}
/* sheet */
.sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheetwrap.out{opacity:0;transition:opacity .2s}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:slide .25s ease}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.shh{display:flex;align-items:center;justify-content:space-between}
.shh h2{margin:0;font-size:22px}
.sheet h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500;opacity:.55}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{opacity:1;border-color:var(--ink)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateY(40px);opacity:.5}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 let body="";
 if(useTy){
  body=`<form id="f" class="tyf"><input class="inp" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Skriv svaret…" ${cur.ans?"disabled":""} value="${cur.ans?esc(cur.ans.val||""):""}">
   ${cur.ans?"":`<div class="row"><button type="button" class="ghost" id="idk">Vet ikke</button><button class="primary" id="ok">Svar</button></div>`}</form>`;
 }else{
  body=`<div class="choices">${cur.opts.map((o,i)=>{let cl="choice";if(cur.ans){if(o===a)cl+=" right";else if(i===cur.ans.pick)cl+=" wrong";else cl+=" dim"}
   const d=isDiag?diagFromText(o):null;
   return `<button class="${cl}" data-i="${i}" ${cur.ans?"disabled":""}><span class="key">${"ABCD"[i]}</span><span class="ct">${d?dsvg(d,26):""}${esc(o)}</span></button>`}).join("")}</div>`;
 }
 let fb="";
 if(cur.ans){
  fb=`<div class="fb ${cur.ans.ok?"ok":"bad"}"><div class="fbh">${cur.ans.ok?"Riktig!":"Ikke helt"}${cur.ans.extra?` <span>· ${esc(cur.ans.extra)}</span>`:""}</div>
   ${(!cur.ans.ok||useTy)?`<div class="fa"><span>Fasit</span>${esc(a)}</div>`:""}
   ${c.note?`<div class="fn">${esc(c.note)}</div>`:""}
   ${useTy&&!cur.ans.ok?`<button class="link" id="ovr">Jeg hadde faktisk rett</button>`:""}</div>
   <button class="primary next" id="nx">${sess.i+1<n?"Neste":"Se resultat"} <span aria-hidden="true">→</span></button>`;
 }
 app.innerHTML=`
 <div class="playbar"><button class="icon" id="quit" aria-label="Avslutt">${XICON}</button>
  <div class="pbar"><i style="width:${100*pos/n}%"></i></div><div class="pc">${Math.min(sess.i+1,n)}/${n}</div></div>
 <article class="qcard ${cur.ans?(cur.ans.ok?"pop":"shake"):""}" id="qc">
  <div class="meta"><span class="tag" style="--tc:${CATCOL[c.cat]||"#666"}">${esc(c.cat)}</span><span class="lvl">${gname(c.lv)}</span>
   ${pat?`<span class="pat">${dsvg(PD[pat],16)}${pat}</span>`:""}</div>
  <h2 class="qq">${esc(q)}</h2>
  ${body}
 </article>
 ${fb}`;
 const $=id=>document.getElementById(id);
 $("quit").onclick=()=>{if(sess.i>0||cur.ans)showSummary();else{view="home";renderHome()}};
 if(useTy){
  const inp=$("in");if(!cur.ans)setTimeout(()=>inp.focus(),50);
  const check=()=>{const v=inp.value.trim();if(!v)return;const t=norm(core(a)),u=norm(v);
   const d=lev(t,u);const ok=d===0||(t.length>5&&d<=Math.max(1,Math.floor(t.length*0.15)));
   answer(ok,{val:v,extra:ok&&d>0?"liten skrivefeil godtatt":""})};
  $("f").onsubmit=e=>{e.preventDefault();if(cur.ans)next();else check()};
  if($("idk"))$("idk").onclick=()=>answer(false,{val:""});
  if($("ovr"))$("ovr").onclick=()=>{sess.miss=sess.miss.filter(x=>x!==c);sess.right++;st.known[c.id]=1;save();cur.ans.ok=true;cur.ans.extra="godkjent av deg";renderPlay()};
 }else app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;answer(cur.opts[i]===a,{pick:i})});
 if($("nx")){$("nx").onclick=next;$("nx").focus({preventScroll:true})}
}
function answer(ok,extra){
 cur.ans=Object.assign({ok},extra);
 if(ok){sess.right++;st.known[cur.c.id]=1;save();haptic(15)}else{sess.miss.push(cur.c);haptic([60,40,60])}
 renderPlay();
 const fb=document.querySelector(".fb");if(fb)fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){sess.i++;if(sess.i>=sess.cards.length)showSummary();else newCard();window.scrollTo({top:0})}

function showSummary(){
 view="summary";
 const done=sess.i+(cur&&cur.ans&&sess.i<sess.cards.length?1:0),n=Math.max(done,1);
 const pct=Math.round(100*sess.right/n);
 const byCat={};sess.miss.forEach(c=>byCat[c.cat]=(byCat[c.cat]||0)+1);
 const weak=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
 const pool=C.filter(c=>on(c)&&st.cats.includes(c.cat));const kn=pool.filter(c=>st.known[c.id]).length;const tp=pool.length?Math.round(100*kn/pool.length):0;
 const msg=pct===100?"Perfekt! 🥋":pct>=80?"Sterkt jobbet!":pct>=50?"God fremgang – fortsett!":"Bra start – øving gjør mester.";
 const R=52,Cc=2*Math.PI*R;
 app.innerHTML=`
 <div class="sum">
  <div class="ring"><svg viewBox="0 0 120 120" width="150" height="150"><circle cx="60" cy="60" r="${R}" class="rbg"/><circle cx="60" cy="60" r="${R}" class="rfg" stroke-dasharray="${Cc}" stroke-dashoffset="${Cc*(1-pct/100)}"/></svg><div class="rv"><span>${pct}<small>%</small></span></div></div>
  <h2>${msg}</h2>
  <p class="sub">${sess.right} av ${done} riktige</p>
  <div class="gstat">${beltSVG(gradeOf(st.lv),56,12)}<span>${gname(st.lv)}${st.scope==="only"?" (kun graden)":""}: du kan ${kn} av ${pool.length} spørsmål (${tp} %)</span></div>
  ${weak.length?`<div class="weak"><h3>Dette bør du øve mer på</h3>${weak.map(([k,v])=>`<div class="wrow"><span class="tag" style="--tc:${CATCOL[k]||"#666"}">${esc(k)}</span><b>${v} feil</b></div>`).join("")}</div>`:""}
  <div class="sumbtns">
   ${sess.miss.length?`<button class="primary" id="retry">Øv på feilene (${sess.miss.length})</button>`:""}
   <button class="${sess.miss.length?"ghost":"primary"}" id="again">Ny økt</button>
   <button class="ghost" id="home">Til forsiden</button>
  </div>
 </div>`;
 if(pct===100&&done>=5)confetti();
 const $=id=>document.getElementById(id);
 if($("retry"))$("retry").onclick=()=>startSession(pick(sess.miss,999));
 $("again").onclick=()=>startSession();
 $("home").onclick=()=>{view="home";renderHome()};
}
function confetti(){const cols=["#d6402a","#2f5da8","#2e7d46","#f2c230"];const box=document.createElement("div");box.className="confetti";
 for(let i=0;i<70;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.background=cols[i%4];p.style.animationDelay=Math.random()*.6+"s";p.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(p)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),3500)}

// ---------- INNSTILLINGER ----------
function openSettings(){
 const sh=document.createElement("div");sh.className="sheetwrap";
 const draw=()=>{sh.innerHTML=`<div class="sheet" role="dialog" aria-label="Innstillinger"><div class="grab"></div>
  <div class="shh"><h2>Innstillinger</h2><button class="icon" id="cl" aria-label="Lukk">${XICON}</button></div>
  <h3>Svarform</h3><div class="seg" id="mode"><button data-v="mc" class="${st.mode==="mc"?"on":""}">Flervalg</button><button data-v="ty" class="${st.mode==="ty"?"on":""}">Skriv svar</button></div><p class="hint" style="margin:8px 0 0">Skriv svar brukes på korte svar som ordliste, treffpunkter, klarstillinger og tall. Lange teknikknavn blir alltid flervalg. Ulike skrivemåter godtas (f.eks. kiokja/giokja).</p>
  <h3>Ordliste</h3><div class="seg" id="rev"><button data-v="0" class="${!st.rev?"on":""}">Norsk → koreansk</button><button data-v="1" class="${st.rev?"on":""}">Koreansk → norsk</button></div>
  <div class="th3"><h3>Temaer</h3><button class="selall" id="selall">${st.cats.length===cats.length?"Velg ingen":"Velg alle"}</button></div><div class="chips">${cats.map(k=>`<button class="chip${st.cats.includes(k)?" on":""}" data-c="${esc(k)}"><i style="background:${CATCOL[k]}"></i>${esc(k)}</button>`).join("")}</div>
  <h3>Fremgang</h3><button class="danger" id="reset">${sh.confirm?"Trykk igjen for å slette all fremgang":"Nullstill fremgang"}</button>
  <p class="foot">Røyken Taekwon-Do Klubb · teoriquiz</p></div>`;
  sh.querySelector("#cl").onclick=close;
  sh.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{st.mode=b.dataset.v;save();draw()});
  sh.querySelectorAll("#rev button").forEach(b=>b.onclick=()=>{st.rev=b.dataset.v==="1";save();draw()});
  sh.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const k=b.dataset.c;st.cats=st.cats.includes(k)?st.cats.filter(x=>x!==k):[...st.cats,k];save();draw()});
  sh.querySelector("#selall").onclick=()=>{st.cats=st.cats.length===cats.length?[]:cats.slice();save();draw()};
  sh.querySelector("#reset").onclick=()=>{if(sh.confirm){st.known={};save();sh.confirm=false}else sh.confirm=true;draw()};
 };
 const close=()=>{sh.classList.add("out");setTimeout(()=>{sh.remove();if(view==="home")renderHome()},200)};
 sh.onclick=e=>{if(e.target===sh)close()};
 draw();document.body.appendChild(sh);
}

// ---------- TASTATUR OG SVEIP ----------
document.addEventListener("keydown",e=>{if(view!=="play"||e.target.tagName==="INPUT")return;
 if(/^[1-4a-dA-D]$/.test(e.key)){const i=/\d/.test(e.key)?+e.key-1:"abcd".indexOf(e.key.toLowerCase());const b=document.querySelectorAll(".choice")[i];if(b&&!b.disabled)b.click()}
 else if(e.key==="Enter"||e.key==="ArrowRight"){const n=document.getElementById("nx");if(n){e.preventDefault();n.click()}}});
let tx=null;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(tx===null||view!=="play"||!cur||!cur.ans)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(dx<-70)next()},{passive:true});

renderHome();

// ---------- AUTO-OPPDATERING ----------
const APP_VERSION="20261115-121311";
async function checkUpdate(){try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.json()).v;if(!v||v===APP_VERSION)return;const k="tkd_reload_"+v;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1")}catch(e){}location.replace(location.pathname+"?v="+encodeURIComponent(v)+location.hash)}catch(e){}}
checkUpdate();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&view!=="play")checkUpdate()});
window.addEventListener("pageshow",e=>{if(e.persisted)checkUpdate()});
</script>
</body>
</html>
